
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KENZIE.AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial,sans-serif;padding:25px 16px}
main{max-width:550px;margin:35px auto}
h1{text-align:center;font-size:36px;letter-spacing:3px}
h1 span{color:#a78bfa}
p{text-align:center;color:#aaa}
.panel{background:#171717;border:1px solid #333;border-radius:18px;padding:20px;margin-top:25px}
.upload{display:block;border:2px dashed #555;border-radius:14px;padding:35px 12px;text-align:center;cursor:pointer;color:#bbb}
input{display:none}
img{width:100%;max-height:300px;object-fit:contain;margin-top:15px;border-radius:12px}
button{width:100%;padding:15px;border:0;border-radius:12px;background:#8b5cf6;color:white;font-weight:bold;font-size:16px;margin-top:18px}
textarea{width:100%;height:130px;background:#101010;color:white;border:1px solid #444;border-radius:12px;padding:12px;margin-top:15px}
small{display:block;text-align:center;color:#777;margin-top:25px}
</style>
</head>
<body>
<main>
<h1>KENZIE<span>.AI</span></h1>
<p>Ubah gambar menjadi prompt AI dengan mudah.</p>
<div class="panel">
<label class="upload" for="gambar">
Pilih gambar dari perangkat kamu
<input id="gambar" type="file" accept="image/*">
</label>
<img id="preview" hidden>
<button onclick="proses()">GENERATE PROMPT</button>
<textarea id="hasil" placeholder="Hasil prompt akan muncul di sini..." readonly></textarea>
</div>
<small>KENZIE.AI © 2026 — Lifetime Access</small>
</main>
<script>
const gambar=document.getElementById('gambar');
const preview=document.getElementById('preview');
gambar.addEventListener('change',()=>{
const file=gambar.files[0];
if(file){
preview.src=URL.createObjectURL(file);
preview.hidden=false;
}
});
function proses(){
alert("Fitur AI sedang dalam tahap pemasangan. Silakan tunggu tahap berikutnya.");
}
</script>
</body>
</html>
